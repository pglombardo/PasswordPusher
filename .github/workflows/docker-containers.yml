name: Docker Container Builds

on:
  push:
    tags:
      - "v*.*.*"

  workflow_dispatch:
    inputs:
      dockerPush:
        description: 'Push image to docker hub?'
        required: true
        type: boolean
        default: false
  schedule:
    # * is a special character in YAML so you have to quote this string
    # Run every day at 5:24 UTC - build 'nightly' docker containers
    - cron: "24 17 * * *"

  pull_request:
    types:
      - labeled

permissions:
  contents: read

jobs:
  docker-configured:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          if [ -n "${DOCKER_USERNAME}" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

  pwpush-container:
    needs: docker-configured
    if: needs.docker-configured.outputs.enabled == 'true' && ((github.event.label && github.event.label.name == 'docker') || github.event_name != 'pull_request')
    uses: ./.github/workflows/docker-build-image.yml
    secrets: inherit
    with:
      image: pwpush
      dockerfile: ./containers/docker/Dockerfile
      bundle-cache: true
      push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}

  public-gateway-container:
    needs: [docker-configured, pwpush-container]
    if: needs.docker-configured.outputs.enabled == 'true' && ((github.event.label && github.event.label.name == 'docker') || github.event_name != 'pull_request')
    uses: ./.github/workflows/docker-build-image.yml
    secrets: inherit
    with:
      image: pwpush-public-gateway
      dockerfile: ./containers/docker/Dockerfile.public-gateway
      push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
      base-image: ${{ needs.pwpush-container.outputs.image-ref }}

  worker-container:
    needs: [docker-configured, pwpush-container]
    if: needs.docker-configured.outputs.enabled == 'true' && ((github.event.label && github.event.label.name == 'docker') || github.event_name != 'pull_request')
    uses: ./.github/workflows/docker-build-image.yml
    secrets: inherit
    with:
      image: pwpush-worker
      dockerfile: ./containers/docker/Dockerfile.worker
      push: ${{ github.event_name != 'pull_request' || !github.event.pull_request.head.repo.fork }}
      base-image: ${{ needs.pwpush-container.outputs.image-ref }}
