name: Build multi-arch Docker image

# Reusable workflow: builds one image natively on amd64 + arm64 runners
# (no QEMU), pushes each platform by digest, then stitches the digests into a
# single multi-arch manifest list carrying all of the metadata tags.

on:
  workflow_call:
    inputs:
      image:
        description: Image repository name (without the Docker Hub namespace), e.g. pwpush
        required: true
        type: string
      dockerfile:
        description: Path to the Dockerfile
        required: true
        type: string
      push:
        description: Push images and create the multi-arch manifest
        required: true
        type: boolean
      base-image:
        description: Optional BASE_IMAGE build arg (e.g. a pinned pwpush digest)
        required: false
        type: string
        default: ""
      bundle-cache:
        description: Persist the Dockerfile's bundler cache mount between runs
        required: false
        type: boolean
        default: false
    outputs:
      image-ref:
        description: Pinned reference (name@sha256:...) to the pushed multi-arch manifest list
        value: ${{ jobs.merge.outputs.image-ref }}

permissions:
  contents: read

env:
  DOCKER_PUSH: ${{ inputs.push }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - id: campfire-configured
        env:
          CAMPFIRE_MESSAGES_URL: ${{ secrets.CAMPFIRE_MESSAGES_URL }}
        run: |
          if [ -n "${CAMPFIRE_MESSAGES_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.ref }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      # Runners are ephemeral and `cache-to` does not export RUN cache mounts,
      # so round-trip the bundler cache mount through actions/cache. Keyed on
      # the Dockerfile too, so a base image (Ruby/Alpine) bump starts fresh
      # rather than reusing native extensions built against old libraries.
      - name: Restore bundler cache
        if: inputs.bundle-cache
        id: bundle-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: bundle-cache
          key: bundle-${{ matrix.arch }}-${{ hashFiles(inputs.dockerfile) }}-${{ hashFiles('Gemfile.lock') }}
          restore-keys: bundle-${{ matrix.arch }}-${{ hashFiles(inputs.dockerfile) }}-

      - name: Inject bundler cache into BuildKit
        if: inputs.bundle-cache
        uses: reproducible-containers/buildkit-cache-dance@5422eac04292c961a382e0f584ea0f03ad9da723 # v3.4.0
        with:
          cache-map: |
            {
              "bundle-cache": {
                "target": "/cache/bundle",
                "id": "bundle-${{ matrix.arch }}"
              }
            }
          skip-extraction: ${{ steps.bundle-cache.outputs.cache-hit }}

      - name: Populate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}

      - name: Login to DockerHub
        if: inputs.push
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ inputs.dockerfile }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: ${{ inputs.base-image != '' && format('BASE_IMAGE={0}', inputs.base-image) || '' }}
          outputs: ${{ inputs.push && format('type=image,name={0}/{1},push-by-digest=true,name-canonical=true,push=true', secrets.DOCKER_USERNAME, inputs.image) || 'type=cacheonly' }}
          cache-from: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}:buildcache-${{ matrix.arch }}
            type=gha,scope=${{ inputs.image }}-${{ matrix.arch }}
          cache-to: |
            type=registry,ref=${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}:buildcache-${{ matrix.arch }},mode=max,ignore-error=${{ env.DOCKER_PUSH == 'false' }}
            type=gha,scope=${{ inputs.image }}-${{ matrix.arch }},mode=max

      - name: Export digest
        if: inputs.push
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "${RUNNER_TEMP}/digests"
          touch "${RUNNER_TEMP}/digests/${DIGEST#sha256:}"

      - name: Upload digest
        if: inputs.push
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ inputs.image }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Post job failure details to Campfire
        if: failure() && steps.campfire-configured.outputs.configured == 'true' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: shane-lamb/campfire-notify-action@df63cf73810147306276e281bedccf71c1519caf # v1.1.6
        with:
          messages_url: ${{ secrets.CAMPFIRE_MESSAGES_URL }}
          template: job_failed

  merge:
    needs: build
    if: inputs.push
    runs-on: ubuntu-latest
    outputs:
      image-ref: ${{ steps.inspect.outputs.image-ref }}
    steps:
      - id: campfire-configured
        env:
          CAMPFIRE_MESSAGES_URL: ${{ secrets.CAMPFIRE_MESSAGES_URL }}
        run: |
          if [ -n "${CAMPFIRE_MESSAGES_URL}" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ inputs.image }}-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@594f3bf4285d9ea8dc53c9a0c9c4092420091003 # v4

      - name: Populate Docker metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}
          tags: |
            type=ref,event=pr,format=pr-{{ref}}-docker
            type=match,pattern=stable
            type=schedule,pattern=nightly
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Login to DockerHub
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Create multi-arch manifest list
        working-directory: ${{ runner.temp }}/digests
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}
        run: |
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${IMAGE}@sha256:%s " *)

      - name: Inspect manifest list
        id: inspect
        env:
          IMAGE: ${{ secrets.DOCKER_USERNAME }}/${{ inputs.image }}
        run: |
          ref=$(jq -r '.tags[0]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          docker buildx imagetools inspect "${ref}"
          digest=$(docker buildx imagetools inspect "${ref}" --format '{{json .Manifest}}' | jq -r '.digest')
          echo "image-ref=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - name: Post job failure details to Campfire
        if: failure() && steps.campfire-configured.outputs.configured == 'true' && github.ref == 'refs/heads/master'
        continue-on-error: true
        uses: shane-lamb/campfire-notify-action@df63cf73810147306276e281bedccf71c1519caf # v1.1.6
        with:
          messages_url: ${{ secrets.CAMPFIRE_MESSAGES_URL }}
          template: job_failed
