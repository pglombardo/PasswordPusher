# Render Blueprint – Password Pusher
# https://render.com/docs/blueprint-spec
#
# Builds containers/docker/Dockerfile (Ruby 4.0.9, Node, asset build, migrations,
# and the Solid Queue worker). The image entrypoint listens on $PORT.
#
# Auto-deploy is off so a push to this repo does not redeploy every instance
# created from the Deploy to Render button. Turn it on in the dashboard to track master.

services:
  - type: web
    name: pwpush-web
    runtime: docker
    dockerfilePath: containers/docker/Dockerfile
    dockerContext: .
    branch: master
    plan: 1c-2g
    region: oregon
    healthCheckPath: /up
    autoDeployTrigger: off
    disk:
      name: pwpush-storage
      mountPath: /opt/PasswordPusher/storage
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pwpush-db
          property: connectionString
      - key: SECRET_KEY_BASE
        generateValue: true
      - key: PWPUSH_MASTER_KEY
        generateValue: true
      - key: RAILS_ENV
        value: production
      - key: RACK_ENV
        value: production
      - key: PWP__ALLOW_ANONYMOUS
        value: "true"
      - key: PWP__DISABLE_SIGNUPS
        value: "false"
      - key: PWP__DISABLE_LOGINS
        value: "false"
      - key: PWP__REQUIRE_MFA
        value: "false"
      - key: PWP__ENABLE_FILE_PUSHES
        value: "true"
      - key: PWP__ENABLE_URL_PUSHES
        value: "true"
      - key: PWP__ENABLE_QR_PUSHES
        value: "true"
      - key: PWP__ENABLE_USER_ACCOUNT_EMAILS
        value: "false"
      - key: PWP__FILES__STORAGE
        value: local

databases:
  - name: pwpush-db
    plan: 0.5c-1g
    diskSizeGB: 1
    postgresMajorVersion: "16"
    databaseName: pwpush
    user: pwpush
