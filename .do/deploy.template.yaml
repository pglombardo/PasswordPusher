# DigitalOcean App Platform deploy template (Deploy to DO button).
# App spec reference: https://docs.digitalocean.com/products/app-platform/reference/app-spec/
#
# Builds containers/docker/Dockerfile. The entrypoint migrates, then runs the
# web process and Solid Queue worker. App Platform sets PORT to http_port;
# the entrypoint binds Puma to that port.
#
# Before launch, replace the two SECRET values. A placeholder master key is public.

spec:
  name: passwordpusher
  region: nyc

  alerts:
    - rule: DEPLOYMENT_FAILED
    - rule: DOMAIN_FAILED

  databases:
    - name: pwpush-db
      engine: PG
      version: "16"
      production: true

  services:
    - name: pwpush
      dockerfile_path: containers/docker/Dockerfile
      github:
        branch: master
        deploy_on_push: true
        repo: pglombardo/PasswordPusher
      instance_count: 1
      instance_size_slug: apps-s-1vcpu-1gb
      http_port: 8080
      health_check:
        http_path: /up
        port: 8080
        initial_delay_seconds: 60
        period_seconds: 10
        timeout_seconds: 5
        success_threshold: 1
        failure_threshold: 5
      envs:
        - key: DATABASE_URL
          scope: RUN_TIME
          type: GENERAL
          value: ${pwpush-db.DATABASE_URL}
        - key: RAILS_ENV
          scope: RUN_TIME
          type: GENERAL
          value: production
        - key: RACK_ENV
          scope: RUN_TIME
          type: GENERAL
          value: production
        - key: SECRET_KEY_BASE
          scope: RUN_TIME
          type: SECRET
          value: "REPLACE_WITH_rails_secret"
        - key: PWPUSH_MASTER_KEY
          scope: RUN_TIME
          type: SECRET
          value: "REPLACE_WITH_lockbox_generate_key"
        - key: WEB_CONCURRENCY
          scope: RUN_TIME
          type: GENERAL
          value: "0"
        - key: PWP__HOST_PROTOCOL
          scope: RUN_TIME
          type: GENERAL
          value: https
        - key: PWP__ALLOW_ANONYMOUS
          scope: RUN_TIME
          type: GENERAL
          value: "true"
        - key: PWP__DISABLE_SIGNUPS
          scope: RUN_TIME
          type: GENERAL
          value: "false"
        - key: PWP__DISABLE_LOGINS
          scope: RUN_TIME
          type: GENERAL
          value: "false"
        - key: PWP__REQUIRE_MFA
          scope: RUN_TIME
          type: GENERAL
          value: "false"
        - key: PWP__ENABLE_USER_ACCOUNT_EMAILS
          scope: RUN_TIME
          type: GENERAL
          value: "false"
        - key: PWP__ENABLE_FILE_PUSHES
          scope: RUN_TIME
          type: GENERAL
          value: "true"
        - key: PWP__ENABLE_URL_PUSHES
          scope: RUN_TIME
          type: GENERAL
          value: "true"
        - key: PWP__ENABLE_QR_PUSHES
          scope: RUN_TIME
          type: GENERAL
          value: "true"
        # Local files live on the instance disk and do not survive a new container.
        # Use an S3-compatible backend for durable file pushes.
        - key: PWP__FILES__STORAGE
          scope: RUN_TIME
          type: GENERAL
          value: local
